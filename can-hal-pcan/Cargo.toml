[package]
name = "can-hal-pcan"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "PCAN-Basic backend for can-hal-rs traits (Windows and Linux)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/can-hal-rs-contributors/can-hal-rs"
keywords = ["can", "can-bus", "pcan", "peak", "canfd"]
categories = ["hardware-support"]

[lints]
workspace = true

[dependencies]
can-hal = { workspace = true }
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
# libc::major and libc::minor are safe functions from 0.2.171.
libc = "0.2.171"
